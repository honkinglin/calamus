<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calamus · Vanilla JavaScript</title>
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">{"imports":{"@calamus/core":"./vendor/index.js"}}</script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main>
    <header><p class="eyebrow">CALAMUS / SDK EXAMPLE</p><h1>A little space to draw.</h1><p>Plain JavaScript. One canvas. Your next idea.</p></header>
    <section aria-label="Drawing controls" class="controls">
      <label>Tool <select id="tool"><option value="pen">Pen</option><option value="eraser">Eraser</option></select></label>
      <label>Ink <input id="color" type="color" value="#253631" /></label>
      <label>Width <input id="size" type="range" min="1" max="24" value="6" /></label>
      <label>Stabilization <select id="stability"><option value="smooth">Adaptive smoothing</option><option value="follow">Radius follow</option><option value="raw">Raw input</option></select></label>
    </section>
    <div class="paper"><canvas id="drawing" aria-label="Drawing surface">Use a browser with Canvas support to draw.</canvas></div>
    <section aria-label="Document actions" class="actions">
      <button id="undo" type="button">Undo</button><button id="redo" type="button">Redo</button><button id="clear" type="button">Clear</button>
      <button id="png" type="button">Save PNG</button><button id="svg" type="button">Save SVG</button><button id="json" type="button">Save JSON</button>
      <button id="lifecycle" type="button">Destroy instance</button>
    </section>
    <p id="status" role="status" aria-live="polite">Ready to draw.</p>
    <footer>Exports contain completed strokes. This example does not upload or auto-save your work.</footer>
  </main>
</body>
</html>
